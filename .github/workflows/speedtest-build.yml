name: Speedtest Port Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  x64_build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Ensure MFC (ATLMFC) component
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
        $vsPath = & $vswhere -latest -products * -property installationPath
        Write-Host "VS install path: $vsPath"
        $mfcHeader = Get-ChildItem -Path "$vsPath/VC/Tools/MSVC" -Recurse -Filter afxwin.h -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($mfcHeader) {
          Write-Host "MFC already installed: $($mfcHeader.FullName)"
        } else {
          Write-Host "MFC not found, installing Microsoft.VisualStudio.Component.VC.ATLMFC ..."
          $setup = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/setup.exe"
          $proc = Start-Process -FilePath $setup -ArgumentList @('modify','--installPath',"`"$vsPath`"",'--add','Microsoft.VisualStudio.Component.VC.ATLMFC','--quiet','--norestart') -Wait -PassThru
          Write-Host "Installer exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) { exit $proc.ExitCode }
          $mfcHeader = Get-ChildItem -Path "$vsPath/VC/Tools/MSVC" -Recurse -Filter afxwin.h -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $mfcHeader) { Write-Host "ERROR: afxwin.h still missing after install"; exit 1 }
          Write-Host "MFC installed: $($mfcHeader.FullName)"
        }

    - name: Run msbuild (Release x64)
      run: msbuild TrafficMonitor.sln -p:configuration=Release -p:platform=x64 -p:platformToolset=v143 -m -v:m

    - name: Upload TrafficMonitor.exe artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrafficMonitor-speedtest-x64
        path: |
          Bin/x64/Release/TrafficMonitor.exe
          Bin/x64/Release/*.dll
          Bin/x64/Release/*.xml
        if-no-files-found: error
